<!doctype html>
<html lang="en" data-theme="blush" data-face="serif">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Reader</title>
<meta name="description" content="Read English books, tap any word for its French translation, and build a vocabulary list as you go.">
<meta name="theme-color" content="#a65d6b">
<meta name="app-build" content="1.0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script>
/* If the app's code cannot start (a file missing on the website, or an old/new file mix), say so on screen instead of showing a dead page. */
window.__appBooted = false;
window.appBootFailed = function (why) {
  if (window.__appBooted || document.getElementById('boot-warn')) return;
  var FILES = ['app.js', 'lex.js', 'paginate.js', 'chapters.js', 'style.css', 'manifest.webmanifest', 'vendor/jszip.min.js', 'vendor/pdf.min.mjs'];
  var box = document.createElement('div'); box.id = 'boot-warn';
  box.setAttribute('style', 'position:fixed;z-index:99999;left:12px;right:12px;top:12px;padding:14px 16px;border-radius:14px;background:#6e3a47;color:#fff;font:14px/1.45 system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.3)');
  box.innerHTML = '<b>English Reader could not start.</b><br>' + why + '<br><span id="boot-files">Checking the files on the website…</span><br>Your books and vocabulary are safe on this phone. <a style="color:#fff;font-weight:700" href="check.html">Open the installation check</a>';
  (document.body || document.documentElement).appendChild(box);
  Promise.all(FILES.map(function (f) { return fetch(f, { method: 'HEAD', cache: 'no-store' }).then(function (r) { return r.ok ? null : f + ' (HTTP ' + r.status + ')'; }, function () { return f + ' (unreachable)'; }); })).then(function (bad) {
    bad = bad.filter(Boolean);
    document.getElementById('boot-files').textContent = bad.length ? 'Missing or unreachable on the website: ' + bad.join(', ') + '.' : 'Every file is on the website, so a script error stopped it. The installation check shows the details.';
  });
};
setTimeout(function () { window.appBootFailed('The app code did not start within 6 seconds.'); }, 6000);
</script>
</head>
<body>
<div id="app">

  <!-- Library -->
  <section id="view-library" class="view">
    <header class="hero">
      <div class="fireflies" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="hero-row">
        <div>
          <h1 class="wordmark">English Reader</h1>
          <p class="tagline">Read English. Tap a word.</p>
        </div>
        <button id="btn-install" class="pill ghost" hidden>Install</button>
      </div>
      <svg class="wave" viewBox="0 0 400 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0 22 C60 4 110 40 200 22 C290 4 340 38 400 18 L400 40 L0 40Z"/></svg>
    </header>
    <main class="shelf-wrap">
      <button id="btn-import" class="btn-primary"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Import Book</span></button>
      <p class="hint">PDF or EPUB · stays on this phone</p>
      <div id="shelf" class="shelf"></div>
      <p id="build" class="build"></p>
    </main>
  </section>

  <!-- Vocabulary -->
  <section id="view-vocab" class="view" hidden>
    <header class="page-head">
      <h2>Vocabulary</h2>
      <p id="vocab-summary" class="sub"></p>
    </header>
    <div class="vocab-tools">
      <div id="vocab-books" class="chips"></div>
      <div class="row">
        <input id="vocab-search" type="search" placeholder="Search words or meanings" autocomplete="off" autocapitalize="off" spellcheck="false">
        <select id="vocab-show" aria-label="Show">
          <option value="all">All</option>
          <option value="todo">To learn</option>
          <option value="learned">Learned</option>
          <option value="phrases">Phrases</option>
        </select>
        <select id="vocab-sort" aria-label="Sort words">
          <option value="recent">Recent</option>
          <option value="count">Most looked up</option>
          <option value="az">A–Z</option>
        </select>
      </div>
    </div>
    <div id="vocab-list" class="vocab-list"></div>
  </section>

  <!-- Reader -->
  <section id="view-reader" class="view reader" hidden>
    <header class="reader-top">
      <button id="r-back" class="icon-btn" aria-label="Back to library"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="r-title"><b id="r-book"></b><span id="r-sec"></span></div>
      <button id="r-vocab" class="icon-btn" aria-label="Vocabulary for this book"><svg viewBox="0 0 24 24"><path d="M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM8 9h8M8 13h8M8 17h5"/></svg><em id="r-vcount"></em></button>
      <button id="r-toc" class="icon-btn" aria-label="Contents"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
      <button id="r-aa" class="icon-btn aa" aria-label="Reading settings">Aa</button>
    </header>
    <div id="r-stage" class="stage">
      <article id="r-text" class="page-text" lang="en"></article>
    </div>
    <footer class="r-foot">
      <div class="r-barwrap"><div id="r-bar"></div></div>
      <div class="r-footrow"><span id="r-chap"></span><button id="r-pg" class="r-pg" aria-label="Go to page">Page 1 of 1</button><span id="r-pct"></span></div>
    </footer>
  </section>

  <nav id="tabs" class="tabs" aria-label="Main">
    <button data-tab="library" class="on"><svg viewBox="0 0 24 24"><path d="M5 4h4v16H5zM10.5 6h4v14h-4zM16 5.4l3.8-1 3 14.6-3.8 1z"/></svg><span>Library</span></button>
    <button data-tab="vocab"><svg viewBox="0 0 24 24"><path d="M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM8 9h8M8 13h8M8 17h5"/></svg><span>Words</span></button>
  </nav>

  <!-- Word popup -->
  <div id="pop" class="pop" hidden role="dialog" aria-live="polite"></div>

  <!-- Sheets -->
  <div id="backdrop" class="backdrop" hidden></div>
  <aside id="sheet-toc" class="sheet" hidden>
    <div class="grip"></div>
    <h3>Go to</h3>
    <div class="goto"><span id="goto-lbl"></span><input id="goto-pg" type="range" min="1" max="1" step="1" aria-label="Page"></div>
    <div class="h4row"><h4>Chapters</h4><button id="open-chapters" class="pill mini">Manage chapters</button></div>
    <ol id="toc-list" class="toc"></ol>
  </aside>
  <aside id="sheet-chap" class="sheet tall" hidden>
    <div class="grip"></div>
    <div class="ch-head"><div><h3>Chapters</h3><p id="ch-book" class="sub2"></p></div><button id="ch-done" class="pill mini">Done</button></div>
    <p id="ch-note" class="ch-note"></p>
    <div id="ch-bar" class="ch-bar"><button id="ch-add" class="btn-primary slim">+ Add chapter</button><button id="ch-sort" class="pill mini">Sort by page</button></div>
    <ol id="ch-list" class="ch-list"></ol>
    <form id="ch-form" class="ch-form" hidden novalidate>
      <h4 id="ch-form-title">Add chapter</h4>
      <label>Title or number<input id="ch-name" type="text" maxlength="80" placeholder="Chapter 1  ·  or just  1" autocomplete="off"></label>
      <div class="ch-pages">
        <label>Starts on page<input id="ch-a" type="number" inputmode="numeric" min="1"></label>
        <label>Ends on page<input id="ch-b" type="number" inputmode="numeric" min="1"></label>
      </div>
      <div class="ch-now"><button type="button" id="ch-a-now" class="pill mini">Start = this page</button><button type="button" id="ch-b-now" class="pill mini">End = this page</button></div>
      <p id="ch-err" class="ch-err" role="alert"></p>
      <div class="ch-save"><button type="button" id="ch-cancel" class="pill mini">Cancel</button><button type="submit" class="btn-primary slim">Save chapter</button></div>
    </form>
  </aside>
  <aside id="sheet-book" class="sheet" hidden>
    <div class="grip"></div>
    <h3 id="sb-title"></h3>
    <div class="sb-actions">
      <button data-act="open">Open book</button>
      <button data-act="chapters">Manage chapters</button>
      <button data-act="remove" class="d">Remove book</button>
    </div>
  </aside>
  <aside id="sheet-set" class="sheet" hidden>
    <div class="grip"></div>
    <h3>Reading</h3>
    <label class="set-row"><span>Text size <em id="v-size"></em></span>
      <input id="set-size" type="range" min="15" max="32" step="1">
    </label>
    <label class="set-row"><span>Line spacing <em id="v-lh"></em></span>
      <input id="set-lh" type="range" min="1.3" max="2.1" step="0.05">
    </label>
    <div class="set-row"><span>Typeface</span>
      <div class="seg" id="set-face"><button data-v="serif">Serif</button><button data-v="sans">Sans</button></div>
    </div>
    <div class="set-row"><span>Page</span>
      <div class="seg" id="set-theme"><button data-v="blush">Blush</button><button data-v="mist">Mist</button><button data-v="night">Night</button></div>
    </div>
  </aside>

  <dialog id="confirm" class="confirm">
    <form method="dialog">
      <h3 id="confirm-title"></h3>
      <p id="confirm-text"></p>
      <div class="confirm-actions">
        <button value="cancel" class="pill ghost">Cancel</button>
        <button value="ok" class="pill danger">Remove</button>
      </div>
    </form>
  </dialog>

  <div id="busy" class="busy" hidden>
    <div class="busy-card">
      <div class="spinner"></div>
      <b id="busy-title">Opening book</b>
      <span id="busy-text"></span>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
</div>

<input id="file" type="file" accept=".pdf,.epub,application/pdf,application/epub+zip" hidden>
<script src="vendor/jszip.min.js"></script>
<script src="app.js" type="module" onerror="appBootFailed('A script file failed to load.')"></script>
</body>
</html>
